<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Homepage of Harold Rhainestone A. Villarin – student developer and creator." />
  <title>Harold Rhainestone A. Villarin | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Styles for the homepage only. Colors and fonts come from style.css -->
  <style>
    .page-home .hero { --photo: min(70vw, 34vh, 340px); }

    /* ---------- Bigger photo with glowing ring ---------- */
    .page-home .photo { width: var(--photo); margin: 0; }
    .page-home .photo::before, .page-home .photo::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
      background: conic-gradient(var(--a1), var(--a2), transparent 70%, var(--a1));
      animation: spin 6s linear infinite;
    }
    .page-home .photo::before { inset: 0; z-index: -1; filter: blur(28px); opacity: 0.75; }
    .page-home .photo::after {
      inset: 6px;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    }
    .page-home .photo-ring { inset: -12px; }
    .page-home .photo-initials { font-size: calc(var(--photo) * 0.26); }

    /* PHOTO SIZE: your picture fills the whole circle.
       --body-zoom: higher = bigger (above 1.09 may cut off your shoes)
       --body-shift: moves you up (negative) or down (positive) */
    .page-home .photo { --body-zoom: 1.07; --body-shift: -0.7%; }
    .page-home .photo-frame img {
      object-fit: cover; translate: 0 var(--body-shift); scale: var(--body-zoom);
      transition: filter 0.3s;
    }
    .page-home .photo-frame:hover img { filter: brightness(1.05) saturate(1.1); }

    /* ---------- Icons circling the photo ---------- */
    .hp-orbit { position: absolute; inset: -2px; z-index: 2; pointer-events: none; animation: spin 30s linear infinite; }
    .hp-orbit span { position: absolute; width: 0; height: 0; }
    .hp-orbit span:nth-child(1) { left: 50%; top: 0; }
    .hp-orbit span:nth-child(2) { left: 100%; top: 50%; }
    .hp-orbit span:nth-child(3) { left: 50%; top: 100%; }
    .hp-orbit span:nth-child(4) { left: 0; top: 50%; }
    .hp-orbit b {
      position: absolute; width: clamp(28px, calc(var(--photo) * 0.075), 42px); aspect-ratio: 1;
      translate: -50% -50%; display: grid; place-items: center; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--a2); box-shadow: 0 0 18px rgba(0, 224, 198, 0.35);
      font: 600 clamp(0.8rem, calc(var(--photo) * 0.045), 1.5rem) "JetBrains Mono", monospace; color: var(--a2);
      animation: spin 30s linear infinite reverse;   /* keeps the icons upright */
    }

    /* ---------- Text side ---------- */
    .page-home .hero-inner > *:nth-child(7) { animation-delay: 1s; }
    .hp-badge {
      display: inline-flex; align-items: center; gap: 10px; padding: 4px 16px; border-radius: 50px;
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      font-family: "JetBrains Mono", monospace; font-size: 0.8rem;
    }
    .hp-badge i { width: 9px; height: 9px; border-radius: 50%; background: var(--a2); animation: pulse 2s infinite; }
    .page-home .hero h1 {
      background-image: linear-gradient(90deg, var(--a1), var(--a2), var(--a1)); background-size: 200% auto;
    }
    .page-home .hero h1.glitch { animation: rise 0.9s ease 0.4s forwards, hp-shine 6s linear infinite; }
    @keyframes hp-shine { to { background-position: -200% center; } }
    .page-home .stats { gap: 14px; }
    .page-home .stats > div {
      padding: 10px 20px; border-radius: 14px; background: var(--card); border: 1px solid var(--border);
      transition: transform 0.25s, border-color 0.25s;
    }
    .page-home .stats > div:hover { transform: translateY(-5px); border-color: var(--a2); }
    .page-home .stats strong { font-size: 1.4rem; }
    .orb.hp-orb2 { top: auto; right: auto; bottom: -180px; left: -160px; background: radial-gradient(circle, rgba(0, 224, 198, 0.28), transparent 70%); animation-delay: -4s; }

    /* ---------- Phones and tall screens ---------- */
    @media (max-width: 800px), (orientation: portrait) {
      .page-home .hero { flex-direction: column; justify-content: center; gap: 34px; padding: 90px 6vw 50px; text-align: center; }
      .page-home .photo { order: -1; width: var(--photo); }
      .page-home .hero-inner { flex: 0 1 auto; width: 100%; padding: 0; }
      .page-home .hero h1 { font-size: clamp(1.7rem, 8vw, 3.4rem); }
      .page-home .eyebrow { font-size: 1rem; margin: 4px 0 0; }
      .page-home .typing { font-size: 1.15rem; margin: 0 0 6px; }
      .page-home .lead { font-size: 0.9rem; line-height: 1.5; margin: 0 auto; }
      .page-home .cta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px auto; max-width: 440px; }
      .page-home .btn { padding: 9px 8px; font-size: 0.85rem; }
      .page-home .stats { justify-content: center; gap: 8px; }
      .page-home .stats > div { padding: 6px 12px; }
      .page-home .stats strong { font-size: 1rem; }
      .page-home .stats span { display: block; font-size: 0.75rem; line-height: 1.35; }
    }
    @media (orientation: portrait) and (min-height: 560px) {
      html:has(body.page-home), body.page-home { height: 100%; overflow: hidden; }
      .page-home .hero { height: 100vh; height: 100dvh; min-height: 0; }
    }
    @media (max-width: 600px) and (orientation: portrait) {
      .page-home .hero { --photo: min(66vw, 30vh); gap: 18px; padding: 86px 6vw 40px; }
      .hp-orbit { display: none; }
      .page-home .stats { flex-wrap: nowrap; }
      .page-home .stats > div { min-width: 0; }
    }
    @media (orientation: portrait) and (max-height: 880px) {
      .page-home .lead { display: none; }
    }
    @media (orientation: portrait) and (max-height: 720px) {
      .page-home .hero { --photo: min(56vw, 26vh); gap: 14px; }
      .hp-orbit, .hp-badge, .page-home .eyebrow { display: none; }
    }
    @media (orientation: portrait) and (max-height: 620px) {
      .page-home .stats { display: none; }
    }

    /* ---------- Laptop / desktop: one screen, no scrolling ---------- */
    @media (min-width: 801px) and (orientation: landscape) {
      .page-home .hero {
        --u: calc((100vh - 140px) / 100);   /* 1% of the usable height */
        --photo: min(40vw, calc(100vh - 190px), 640px);
        flex-direction: row; gap: 5vw; padding: 84px 7vw 52px;
      }
      .page-home .hero-inner { padding: 0; }
      .hp-badge { font-size: min(calc(var(--u) * 2.4), 0.85rem); margin-bottom: calc(var(--u) * 1.5); }
      .page-home .eyebrow { font-size: min(calc(var(--u) * 4), 1.8rem); margin: 0; }
      .page-home .hero h1 { font-size: min(calc(var(--u) * 10), 4.6vw, 4.8rem); }
      .page-home .typing { font-size: min(calc(var(--u) * 4.5), 2.4vw, 2rem); margin: calc(var(--u) * 0.5) 0 calc(var(--u) * 1.5); }
      .page-home .lead { font-size: min(calc(var(--u) * 2.9), 1.1rem); line-height: 1.55; }
      .page-home .cta { gap: 12px; margin: calc(var(--u) * 4) 0; }
      .page-home .btn { padding: calc(var(--u) * 1.4) 22px; font-size: min(calc(var(--u) * 2.8), 1rem); line-height: 1.5; }
      .page-home .stats > div { padding: calc(var(--u) * 1.2) 20px; }
      .page-home .stats strong { font-size: min(calc(var(--u) * 3.8), 1.6rem); }
      .page-home .stats span { display: block; font-size: min(calc(var(--u) * 2.4), 0.85rem); line-height: 1.4; }
    }
    @media (min-width: 801px) and (max-width: 1200px) and (orientation: landscape) {
      .page-home .cta { display: grid; grid-template-columns: max-content max-content; }
      .page-home .btn { text-align: center; }
      .page-home .stats { gap: 8px; flex-wrap: nowrap; }
      .page-home .stats > div { padding-inline: 10px; }
    }
    @media (min-width: 801px) and (orientation: landscape) and (min-height: 450px) {
      html:has(body.page-home), body.page-home { height: 100%; overflow: hidden; }
      .page-home .hero { height: 100vh; height: 100dvh; min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-home .hero h1.glitch { animation: none !important; opacity: 1; transform: none; }
    }

    /* ---------- Menu in the middle of the top bar ---------- */
    .page-home .nav { justify-content: center; }
    .page-home .nav-right { margin-inline: auto; justify-content: center; }
    .page-home .nav .logo { position: absolute; left: 6vw; }
    /* light / dark switch in the top right corner */
    .page-home .nav .icon-btn { position: absolute; top: 20px; right: 20px; }
    @media (max-width: 800px) {
      .page-home .nav { padding-inline: 54px; }
      .page-home .nav .logo { display: none; }
      .page-home .nav-right { flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
      .page-home .nav-right > a { display: inline; font-size: 0.78rem; }
      .page-home .nav .icon-btn { top: 14px; right: 12px; width: 32px; height: 32px; font-size: 0.9rem; }
    }
  </style>
</head>
<body class="page-home">
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <header class="nav">
    <div class="nav-right">
      <a href="about.html">Personal Info</a>
      <a href="achievements.html">Achievements</a>
      <a href="family.html">Family &amp; Friends</a>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="hero">
    <canvas id="bg"></canvas>
    <div class="orb"></div>
    <div class="orb hp-orb2"></div>

    <div class="hero-inner">
      <p class="eyebrow">Hello, I'm</p>
      <h1 class="glitch" data-text="Harold Rhainestone A. Villarin">Harold Rhainestone A. Villarin</h1>
      <h2 class="typing"><span id="typed"></span><span class="caret">|</span></h2>
      <p class="lead">
        I turn ideas into clean, fast and fun digital experiences.
        Currently learning, building and breaking things so I can make them better.
      </p>
    </div>

    <!-- PROFILE PICTURE: save your photo as me.jpg (in the same folder as this file) -->
    <div class="photo" aria-label="Profile picture">
      <div class="photo-ring"></div>
      <div class="photo-frame">
        <span class="photo-initials">HV</span>
        <img src="me.jpg" alt="Harold Rhainestone A. Villarin" onerror="this.remove()" />
      </div>
      <!-- Icons circling your photo: coding, football, design, laptop -->
      <div class="hp-orbit" aria-hidden="true">
        <span><b>&lt;/&gt;</b></span><span><b>⚽</b></span><span><b>🎨</b></span><span><b>💻</b></span>
      </div>
    </div>

    <p class="copyright">&copy; 2026 Harold Rhainestone A. Villarin - BSIT</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
