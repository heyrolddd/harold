<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Family and friends of Harold Rhainestone A. Villarin." />
  <title>Harold Rhainestone A. Villarin | Family &amp; Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="family.css" />
  <style>
    /* Photo frame with the caption and names underneath */
    .page-fam .fx-tile { display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 0; padding: 0; background: none; border: 0; color: var(--text); font-family: inherit; text-align: left; cursor: pointer; }
    .page-fam .fx-shot { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; min-height: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--card); transition: border-color 0.25s, box-shadow 0.25s; }
    .page-fam .fx-tile:hover .fx-shot, .page-fam .fx-tile:focus-visible .fx-shot { border-color: var(--a2); box-shadow: 0 10px 30px rgba(124, 92, 255, 0.4); }
    /* whole photo stays visible; a blurred copy fills the rest of the frame */
    .page-fam .fx-shot::before { content: ""; position: absolute; inset: -40px; background: var(--img) center / cover no-repeat; filter: blur(24px) brightness(0.65); }
    .page-fam .fx-shot img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: contain; }
    .page-fam .fx-empty { position: absolute; inset: 0; z-index: 1; display: none; place-items: center; font-size: 2.4rem; }
    .page-fam .fx-tile.missing img { display: none; }
    .page-fam .fx-tile.missing .fx-empty { display: grid; }
    .page-fam .fx-text { display: block; flex: 0 0 auto; height: 4.4rem; padding-top: 6px; overflow: hidden; line-height: 1.3; }
    .page-fam .fx-cap { display: block; font-weight: 700; font-size: clamp(0.8rem, 1.2vw, 1rem); }
    .page-fam .fx-names { display: block; margin-top: 2px; color: var(--muted); font-size: clamp(0.75rem, 1.1vw, 0.95rem); }

    /* LAPTOP / DESKTOP: all photos in one row that fills the screen, no scrolling */
    @media (min-width: 701px) and (orientation: landscape) {
      html:has(body.page-fam), body.page-fam { height: 100%; overflow: hidden; }
      .page-fam .fam-main {
        position: relative; z-index: 1; box-sizing: border-box;
        width: 100%; max-width: none; height: 100vh; height: 100dvh; min-height: 0; margin: 0;
        padding: 84px 16px 8px; overflow: hidden;
        display: grid; gap: 10px 20px;
        grid-template-columns: minmax(0, 1fr) calc((100% - 60px) / 4);   /* 3 family photos, 1 friend photo: all the same width */
        grid-template-rows: auto minmax(0, 1fr);
      }
      .page-fam .fam-main .fam-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 0; padding: 0; }
      .page-fam .fam-main .fam-head h1 { margin: 0; font-size: clamp(1.4rem, 4vh, 2.2rem); line-height: 1.2; }
      .page-fam .fam-main .fam-head p { margin: 0; font-size: 0.9rem; line-height: 1.4; }
      .page-fam .fam-main .head-btns { display: flex; flex: 0 0 auto; gap: 12px; margin: 0; }
      .page-fam .fam-main .head-btns .btn { padding: 8px 18px; font-size: 0.85rem; }
      .page-fam .fam-main .group { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; margin: 0; padding: 0; }
      .page-fam .fam-main .group-head { flex: 0 0 auto; margin: 0 0 8px; padding: 0; }
      .page-fam .fam-main .group .row { flex: 1 1 0; display: flex; flex-wrap: nowrap; align-items: stretch; gap: 20px; width: 100%; height: auto; min-height: 0; max-height: none; margin: 0; padding: 0; overflow: visible; }
      .page-fam .fam-main .group .row .fx-tile { flex: 1 1 0; height: 100%; }
      .page-fam .fam-main .group .row .fx-shot { flex: 1 1 0; aspect-ratio: auto; }
    }
    @media (max-width: 700px), (orientation: portrait) {
      .page-fam .group .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    }
  </style>
</head>
<body class="page-fam">
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <canvas id="bg" class="bg-fixed"></canvas>
  <div class="orb orb-about"></div>

  <header class="nav">
    <a href="index.html" class="logo">&lt;HV<span>/</span>&gt;</a>
    <nav class="nav-right">
      <a href="index.html">Home</a>
      <a href="about.html">Personal Info</a>
      <a href="achievements.html">Achievements</a>
      <a href="family.html" class="active">Family &amp; Friends</a>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>

  <main class="fam-main">
    <div class="fam-head">
      <div>
        <h1>Family &amp; Friends</h1>
        <p>The family who raised me and the friends who made the journey better. Tap any photo to view it larger.</p>
      </div>
      <div class="head-btns">
        <a href="achievements.html" class="btn ghost magnetic">← Back: Achievements</a>
        <a href="index.html" class="btn primary magnetic">Back to Home</a>
      </div>
    </div>

    <section class="group" aria-label="Family">
      <div class="group-head"><h2>FAMILY</h2></div>
      <div class="row" id="rowFamily"></div>
    </section>

    <section class="group" aria-label="Friends">
      <div class="group-head"><h2>FRIENDS</h2></div>
      <div class="row" id="rowFriends"></div>
    </section>
  </main>

  <!-- lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">‹</button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next">›</button>
    <div class="lb-inner">
      <img id="lbImg" src="" alt="" />
      <div class="lb-cap">
        <p class="lb-cat" id="lbCat"></p>
        <h3 id="lbTitle"></h3>
        <p class="lb-count" id="lbCount"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    /* =====================================================================
       EDIT YOUR PHOTOS HERE
       1. Put your photos in the same folder as this file (or in an "images"
          folder, then write "images/father.jpg").
       2. Change "photo" to your file name and "caption" to the label you want.
          Type the person's name in "names" (write names: "" to leave it blank).
       3. To add a photo, copy one line and paste it. To remove one, delete the line.
          (3 photos per row looks best.)
       ===================================================================== */

    const FAMILY = [
      { caption: "Handshake with my dad", names: "Howell L. Villarin", photo: "handshake_dad.jpg" },
      { caption: "Hugging my mom", names: "Rosalie A. Villarin", photo: "hugging_mom.jpg" },
      { caption: "Selfie with my siblings", names: "Harrel A. Villarin and Honey Rhize A. Villarin", photo: "selfie_siblings.jpg" }
    ];

    const FRIENDS = [
      { caption: "Mirror selfie with the boys after taking a bath", names: "Harrieth Austria and Xander Padcayan", photo: "friend.jpg" }
    ];
    /* ===================================================================== */

    (function () {
      const $ = (s, el = document) => el.querySelector(s);
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      const slides = [];

      function render(list, rowId, label) {
        $(rowId).innerHTML = list.map(p => {
          const idx = slides.length;
          slides.push({ src: p.photo, title: p.caption, cat: label });
          return `
          <button class="fx-tile" data-slide="${idx}" style="--img:url('${esc(p.photo)}')" aria-label="View: ${esc(p.caption)}">
            <span class="fx-shot">
              <img src="${esc(p.photo)}" alt="${esc(p.caption)}" />
              <span class="fx-empty" aria-hidden="true">📷</span>
            </span>
            <span class="fx-text">
              <span class="fx-cap">${esc(p.caption)}</span>
              <span class="fx-names">${esc(p.names || "")}</span>
            </span>
          </button>`;
        }).join("");
      }
      render(FAMILY, "#rowFamily", "FAMILY");
      render(FRIENDS, "#rowFriends", "FRIENDS");

      // shows a camera icon if a photo file can't be found
      document.querySelectorAll(".fx-tile img").forEach(img => {
        const missing = () => img.closest(".fx-tile").classList.add("missing");
        img.addEventListener("error", missing);
        if (img.complete && !img.naturalWidth) missing();
      });

      /* ---------- lightbox ---------- */
      const lb = $("#lb"), lbImg = $("#lbImg");
      let cur = 0, opener = null;
      function showSlide(i) {
        cur = (i + slides.length) % slides.length;
        const s = slides[cur];
        lbImg.src = s.src; lbImg.alt = s.title;
        $("#lbCat").textContent = s.cat;
        $("#lbTitle").textContent = s.title;
        $("#lbCount").textContent = (cur + 1) + " / " + slides.length;
      }
      function openLb(i, from) {
        opener = from; showSlide(i);
        lb.classList.add("open"); document.documentElement.classList.add("lb-open");
        $("#lbClose").focus();
      }
      function closeLb() {
        lb.classList.remove("open"); document.documentElement.classList.remove("lb-open");
        if (opener) opener.focus();
      }
      document.querySelector(".fam-main").addEventListener("click", e => {
        const b = e.target.closest(".fx-tile");
        if (b) openLb(+b.dataset.slide, b);
      });
      $("#lbClose").addEventListener("click", closeLb);
      $("#lbPrev").addEventListener("click", () => showSlide(cur - 1));
      $("#lbNext").addEventListener("click", () => showSlide(cur + 1));
      lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-inner")) closeLb(); });
      document.addEventListener("keydown", e => {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") closeLb();
        else if (e.key === "ArrowLeft") showSlide(cur - 1);
        else if (e.key === "ArrowRight") showSlide(cur + 1);
      });
      let tx = null;
      lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", e => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx; tx = null;
        if (Math.abs(dx) > 50) showSlide(cur + (dx < 0 ? 1 : -1));
      });

      /* ---------- custom cursor hover for buttons created after load ---------- */
      const cursor = $("#cursor");
      document.addEventListener("mouseover", e => { if (cursor && e.target.closest("button, a")) cursor.classList.add("hover"); });
      document.addEventListener("mouseout", e => { if (cursor && e.target.closest("button, a")) cursor.classList.remove("hover"); });
    })();
  </script>
</body>
</html>
